    KlinePriceType:
      type: string
      enum:
      - Last
      - Index
      - Mark
    QuantityFilter:
      type: object
      title: QuantityFilter
      required:
      - minQuantity
      - stepSize
      properties:
        minQuantity:
          type: string
          format: decimal
          description: 'Minimum quantity the order book will allow.


            For futures, this will be the threshold at which a position gets closed

            and so it should be as close as possible, preferably equal, to the

            `step_size`.'
        maxQuantity:
          type: string
          format: decimal
          description: Maximum quantity the order book will allow.
        stepSize:
          type: string
          format: decimal
          description: Quantity increment.
    OrderBookState:
      type: string
      enum:
      - Open
      - Closed
      - CancelOnly
      - LimitOnly
      - PostOnly
    PriceBandMeanPremium:
      type: object
      title: PriceBandMeanPremium
      required:
      - tolerancePct
      properties:
        tolerancePct:
          type: string
          format: decimal
          description: 'Maximum allowed deviation from the mean premium. E.g. if

            `tolerance_pct` is 0.05 (5%), and the mean premium is 5%, then

            orders will be prevented from being placed if the premium exceeds 10%.'
    MarketType:
      type: string
      enum:
      - SPOT
      - PERP
      - IPERP
      - DATED
      - PREDICTION
      - RFQ
    StrikePriceCondition:
      type: string
      description: Strike price condition values.
      enum:
      - above
      - below
    ResolutionCondition_StrikePriceResolutionCondition:
      description: Condition that determines how a prediction market resolves.
      allOf:
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - StrikePrice
            example: StrikePrice
      - $ref: '#/components/schemas/StrikePriceResolutionCondition'
    QuantityRangeResolutionCondition:
      type: object
      title: QuantityRangeResolutionCondition
      description: Resolution condition based on quantity range.
      properties:
        greaterThanOrEqual:
          type: string
          format: decimal
          description: Lower bound (inclusive) for the quantity.
        lessThan:
          type: string
          format: decimal
          description: Upper bound (exclusive) for the quantity.
    SeriesRecurrence:
      type: string
      enum:
      - minutely
      - fiveMinutely
      - fifteenMinutely
      - hourly
      - daily
      - weekly
      - monthly
    ApiErrorCode:
      type: string
      enum:
      - ACCOUNT_DEACTIVATED
      - ACCOUNT_LIQUIDATING
      - BORROW_LIMIT
      - BORROW_REQUIRES_LEND_REDEEM
      - FORBIDDEN
      - INSUFFICIENT_FUNDS
      - INSUFFICIENT_MARGIN
      - INSUFFICIENT_SUPPLY
      - INVALID_ASSET
      - INVALID_CLIENT_REQUEST
      - INVALID_MARKET
      - INVALID_ORDER
      - INVALID_PRICE
      - INVALID_POSITION_ID
      - INVALID_QUANTITY
      - INVALID_RANGE
      - INVALID_SIGNATURE
      - INVALID_SOURCE
      - INVALID_SYMBOL
      - INVALID_TWO_FACTOR_CODE
      - LEND_LIMIT
      - LEND_REQUIRES_BORROW_REPAY
      - MAINTENANCE
      - MAX_LEVERAGE_REACHED
      - NOT_IMPLEMENTED
      - ORDER_LIMIT
      - POSITION_LIMIT
      - PRECONDITION_FAILED
      - RESOURCE_NOT_FOUND
      - SERVER_ERROR
      - TIMEOUT
      - TOO_EARLY
      - TOO_MANY_REQUESTS
      - TRADING_PAUSED
      - UNAUTHORIZED
    OrderBookFilters:
      type: object
      title: OrderBookFilters
      required:
      - price
      - quantity
      properties:
        price:
          description: Defines the price rules for the order book.
          allOf:
          - $ref: '#/components/schemas/PriceFilter'
          - description: Defines the price rules for the order book.
        quantity:
          description: Defines the quantity rules for the order book.
          allOf:
          - $ref: '#/components/schemas/QuantityFilter'
          - description: Defines the quantity rules for the order book.
    MarketSession:
      type: object
      title: MarketSession
      required:
      - name
      - startTime
      - endTime
      - timezone
      - startWeekday
      - endWeekday
      properties:
        name:
          type: string
          description: Session name (e.g. "US_MARKET_HOURS").
        description:
          type: string
          description: Session description.
        startTime:
          type: string
          format: naive-time
          description: Session start time (local to the timezone).
        endTime:
          type: string
          format: naive-time
          description: Session end time (local to the timezone).
        timezone:
          type: string
          description: Timezone identifier (e.g. "America/New_York").
        startWeekday:
          type: integer
          format: int32
          description: ISO 8601 weekday on which the session opens (1 = Monday, 7 = Sunday).
        endWeekday:
          type: integer
          format: int32
          description: 'ISO 8601 weekday on which the session last opens. If `endWeekday <

            startWeekday` the range wraps the week (e.g. `7..4` = Sun-Thu).'
    Event:
      type: object
      title: Event
      required:
      - slug
      - title
      - predictionMarkets
      - tags
      - series
      - description
      - quoteVolume
      - resolution
      - resolved
      - resolutionDelaySecs
      properties:
        slug:
          type: string
          description: 'The identifier for the event that the prediction markets are based on.

            Multiple markets for the same event (e.g. `2026-fifa-world-cup-winner-mens`) will have the same identifier.'
        title:
          type: string
          description: 'The title for the prediction event that the prediction markets are based on.

            Multiple prediction markets may have the same title

            E.g. a set of prediction markets of the winner of the world cup would have title `2026 FIFA World Cup Winner`'
        predictionMarkets:
          type: array
          description: The prediction markets associated with this event.
          items:
            $ref: '#/components/schemas/PredictionMarket'
        tags:
          type: array
          description: Tags associated with the prediction event e.g. `["SPORTS", "FOOTBALL", "WORLD CUP"]`
          items:
            $ref: '#/components/schemas/Tag'
        series:
          type: array
          description: 'The series of the prediction event.

            Every world cup winner market will have the same series.'
          items:
            $ref: '#/components/schemas/Series'
        description:
          type: string
          description: A description of the event.
        imgUrl:
          type: string
          description: An image URL associated with the event.
        quoteVolume:
          type: string
          format: decimal
          description: The total 24hr quote volume of the prediction event.
        resolution:
          description: Resolution data for the prediction event.
          allOf:
          - $ref: '#/components/schemas/Resolution'
          - description: Resolution data for the prediction event.
        resolved:
          type: boolean
          description: Whether the event has been resolved.
        resolutionDelaySecs:
          type: integer
          format: int32
          description: 'Seconds to wait after a market''s proposed resolution before resolving it.

            Applied to every market in the event. Bounded server-side to [0, 604800] (7 days).'
    SqrtFunction:
      type: object
      title: SqrtFunction
      required:
      - base
      - factor
      properties:
        base:
          type: string
          format: decimal
        factor:
          type: string
          format: decimal
    ResolutionCondition_QuantityRangeResolutionCondition:
      description: Condition that determines how a prediction market resolves.
      allOf:
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - QuantityRange
            example: QuantityRange
      - $ref: '#/components/schemas/QuantityRangeResolutionCondition'
    StrikePriceResolutionCondition:
      type: object
      title: StrikePriceResolutionCondition
      description: Strike price resolution condition wrapper.
      required:
      - condition
      properties:
        condition:
          $ref: '#/components/schemas/StrikePriceCondition'
    OutcomeResolutionCondition:
      type: object
      title: OutcomeResolutionCondition
      description: Outcome resolution condition wrapper.
      required:
      - outcome
      properties:
        outcome:
          type: string
    ResolutionSource:
      type: string
      description: Source for event resolution prices.
      enum:
      - binance
    SecuritySession:
      type: object
      title: SecuritySession
      required:
      - name
      - minQuantity
      - stepSize
      properties:
        name:
          type: string
          description: Session name — matches a name in the sessions list.
        minQuantity:
          type: string
          format: decimal
          description: Minimum order quantity during this session.
        maxQuantity:
          type: string
          format: decimal
          description: Maximum order quantity during this session.
        stepSize:
          type: string
          format: decimal
          description: Minimum quantity increment during this session.
    FundingIntervalRate:
      type: object
      title: FundingIntervalRate
      required:
      - symbol
      - intervalEndTimestamp
      - fundingRate
      properties:
        symbol:
          type: string
          description: The symbol of the market associated to the funding interval.
        intervalEndTimestamp:
          type: string
          format: naive-date-time
          description: The end of the funding interval.
        fundingRate:
          type: string
          format: decimal
          description: The funding rate for the interval.
    KlineInterval:
      type: string
      enum:
      - 1s
      - 1m
      - 3m
      - 5m
      - 15m
      - 30m
      - 1h
      - 2h
      - 4h
      - 6h
      - 8h
      - 12h
      - 1d
      - 3d
      - 1w
      - 1month
    ResolutionCondition_OutcomeResolutionCondition:
      description: Condition that determines how a prediction market resolves.
      allOf:
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - Outcome
            example: Outcome
      - $ref: '#/components/schemas/OutcomeResolutionCondition'
    Series:
      type: object
      title: Series
      required:
      - slug
      - title
      properties:
        slug:
          type: string
          description: 'The series id of the prediction event e.g. `world-cup-winner-mens`.

            Every world cup winner market will have the same series id.'
        title:
          type: string
          description: The series title of the prediction event e.g. `World Cup winner (mens)`
        recurrence:
          description: The recurrence of the series e.g. `Weekly`.
          allOf:
          - $ref: '#/components/schemas/SeriesRecurrence'
          - description: The recurrence of the series e.g. `Weekly`.
    Security:
      type: object
      title: Security
      required:
      - asset
      - name
      - sessions
      properties:
        asset:
          description: Asset symbol.
          allOf:
          - $ref: '#/components/schemas/CustodyAsset'
          - description: Asset symbol.
        name:
          type: string
          description: Name.
        cusip:
          type: string
          description: CUSIP identifier for the security.
        sessions:
          type: array
          description: Trading sessions with their active hours and quantity filters.
          items:
            $ref: '#/components/schemas/SecuritySession'
    Kline:
      type: object
      title: Kline
      description: 'Public K-line response shape.


        Lives in `bpx_api_types` so that both `api` and `api-klines` can return

        the same JSON shape to clients.'
      required:
      - start
      - end
      - volume
      - quoteVolume
      - trades
      properties:
        start:
          type: string
          description: Start time.
        end:
          type: string
          description: End time.
        open:
          type: string
          description: Open price.
        high:
          type: string
          description: High price.
        low:
          type: string
          description: Low price.
        close:
          type: string
          description: Close price.
        volume:
          type: string
          description: Volume in base asset.
        quoteVolume:
          type: string
          description: Volume in quote asset.
        trades:
          type: string
          description: Number of trades during the K-line.
    ResolutionCondition:
      type: object
      description: Condition that determines how a prediction market resolves.
      anyOf:
      - $ref: '#/components/schemas/ResolutionCondition_QuantityRangeResolutionCondition'
      - $ref: '#/components/schemas/ResolutionCondition_StrikePriceResolutionCondition'
      - $ref: '#/components/schemas/ResolutionCondition_OutcomeResolutionCondition'
      discriminator:
        propertyName: type
        mapping:
          QuantityRange: '#/components/schemas/ResolutionCondition_QuantityRangeResolutionCondition'
          StrikePrice: '#/components/schemas/ResolutionCondition_StrikePriceResolutionCondition'
          Outcome: '#/components/schemas/ResolutionCondition_OutcomeResolutionCondition'
    PositionImfFunction:
      type: object
      anyOf:
      - $ref: '#/components/schemas/PositionImfFunction_SqrtFunction'
      discriminator:
        propertyName: type
        mapping:
          sqrt: '#/components/schemas/PositionImfFunction_SqrtFunction'
    PriceFilter:
      type: object
      title: PriceFilter
      required:
      - minPrice
      - tickSize
      properties:
        minPrice:
          type: string
          format: decimal
          description: Minimum price the order book will allow.
        maxPrice:
          type: string
          format: decimal
          description: Maximum price the order book will allow.
        tickSize:
          type: string
          format: decimal
          description: Price increment.
        maxMultiplier:
          type: string
          format: decimal
          description: Maximum allowed multiplier from last active price.
        minMultiplier:
          type: string
          format: decimal
          description: Minimum allowed multiplier from last active price.
        maxImpactMultiplier:
          type: string
          format: decimal
          description: 'Maximum allowed impact multiplier from best offer. This

            determines how far above the best ask a market buy can penetrate.'
        minImpactMultiplier:
          type: string
          format: decimal
          description: 'Minimum allowed impact multiplier from best bid. This

            determines how far below the best bid a market sell can penetrate.'
        meanMarkPriceBand:
          description: 'Futures price band. Used to determine how far the price is allowed to

            deviate from the mean mark price.'
          allOf:
          - $ref: '#/components/schemas/PriceBandMarkPrice'
          - description: 'Futures price band. Used to determine how far the price is allowed to

              deviate from the mean mark price.'
        meanPremiumBand:
          description: 'Futures price band. Used to determine how far the premium is allowed to

            deviate from the mean premium.'
          allOf:
          - $ref: '#/components/schemas/PriceBandMeanPremium'
          - description: 'Futures price band. Used to determine how far the premium is allowed to

              deviate from the mean premium.'
        borrowEntryFeeMaxMultiplier:
          type: string
          format: decimal
          description: 'Maximum allowed multiplier move from last active price without incurring

            an entry fee for spot margin.'
        borrowEntryFeeMinMultiplier:
          type: string
          format: decimal
          description: 'Minimum allowed multiplier move from last active price without incurring

            an entry fee for spot margin.'
        maxPriceUpdateMultiplier:
          type: string
          format: decimal
          description: 'Maximum allowed multiplier for mark/index price updates relative to

            the previous mark/index price. When set, an update is capped at

            `prev * max_price_update_multiplier`.'
        minPriceUpdateMultiplier:
          type: string
          format: decimal
          description: 'Minimum allowed multiplier for mark/index price updates relative to

            the previous mark/index price. When set, an update is floored at

            `prev * min_price_update_multiplier`.'
    PositionImfFunction_SqrtFunction:
      allOf:
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - sqrt
            example: sqrt
      - $ref: '#/components/schemas/SqrtFunction'
    Resolution:
      type: object
      title: Resolution
      description: Resolution data for a prediction event.
      required:
      - resolved
      - startDate
      properties:
        resolved:
          type: boolean
          description: Whether the event has been resolved. An event is resolved when all associated markets are resolved.
        startDate:
          type: string
          format: naive-date-time
          description: Start time of the prediction event.
        endDate:
          type: string
          format: naive-date-time
          description: End time of the prediction event.
        strikePrice:
          type: string
          format: decimal
          description: The strike price for the prediction event at the start date.
        closePrice:
          type: string
          format: decimal
          description: The closing price at the end of the prediction event at the end date.
        resolutionSourceEventIdentifier:
          type: string
          description: The identifier on the resolution source e.g. BTCUSDT for Binance.
        resolutionSource:
          description: The source for event resolution.
          allOf:
          - $ref: '#/components/schemas/ResolutionSource'
          - description: The source for event resolution.
        outcome:
          type: string
          description: The outcome for outcome-based resolution, e.g. an election winner.
    PriceBandMarkPrice:
      type: object
      title: PriceBandMarkPrice
      required:
      - maxMultiplier
      - minMultiplier
      properties:
        maxMultiplier:
          type: string
          format: decimal
          description: Maximum allowed multiplier move from mean price.
        minMultiplier:
          type: string
          format: decimal
          description: Minimum allowed multiplier move from mean price.
    Depth:
      type: object
      title: Depth
      required:
      - asks
      - bids
      - lastUpdateId
      - timestamp
      properties:
        asks:
          type: array
          description: Asks on the order book.
          items:
            type: array
            items:
              type: string
              format: decimal
            maxLength: 2
            minLength: 2
        bids:
          type: array
          description: Bids on the order book.
          items:
            type: array
            items:
              type: string
              format: decimal
            maxLength: 2
            minLength: 2
        lastUpdateId:
          type: string
          description: Update ID that caused the last change to the order book depth.
        timestamp:
          type: integer
          format: int64
          description: Matching engine timestamp in microseconds.
      example:
        asks:
        - - '21.9'
          - '500.123'
        - - '22.1'
          - '2321.11'
        bids:
        - - '20.12'
          - '255.123'
        - - '20.5'
          - '499.555'
        lastUpdateId: '1684026955123'
        timestamp: 1684026955123
    Ticker:
      type: object
      title: Ticker
      description: 'Public ticker response shape.


        Lives in `bpx_api_types` so that both `api` and `api-klines` can return

        the same JSON shape to clients.'
      required:
      - symbol
      - firstPrice
      - lastPrice
      - priceChange
      - priceChangePercent
      - high
      - low
      - volume
      - quoteVolume
      - trades
      properties:
        symbol:
          type: string
          description: The symbol of the market.
        firstPrice:
          type: string
          format: decimal
          description: First price for the interval.
        lastPrice:
          type: string
          format: decimal
          description: Last price for the interval.
        priceChange:
          type: string
          format: decimal
          description: Price change for the interval.
        priceChangePercent:
          type: string
          format: decimal
          description: Percentage price change for the interval.
        high:
          type: string
          format: decimal
          description: Highest price for the interval.
        low:
          type: string
          format: decimal
          description: Lowest price for the interval.
        volume:
          type: string
          format: decimal
          description: Base volume for the interval.
        quoteVolume:
          type: string
          format: decimal
          description: Quote volume for the interval.
        trades:
          type: string
          description: Trades for the interval.
x-tagGroups:
- name: Public Endpoints
  tags:
  - Assets
