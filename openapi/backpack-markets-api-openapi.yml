openapi: 3.2.0
info:
  title: Backpack Exchange Markets API
  description: '# Introduction


    Welcome to the Backpack Exchange API.'
  version: '1.0'
  x-logo:
    url: https://cdn.prod.website-files.com/66830ad123bea7f626bcf58f/68eccb03852237fd98ffad9b_Backpack-Icon-Color.svg
    altText: Backpack Exchange
  contact:
    name: Backpack Exchange Support
    url: https://support.backpack.exchange/
  license:
    name: Proprietary
servers:
- url: https://api.backpack.exchange
tags:
- name: Markets
  description: Public market data.
paths:
  /api/v1/markets:
    get:
      tags:
      - Markets
      summary: Get markets
      description: Retrieves all the markets that are supported by the exchange.
      parameters:
      - name: marketType
        schema:
          type: array
          items:
            $ref: '#/components/schemas/MarketType'
        in: query
        description: Market type. Defaults to return spot and perp.
        required: false
        deprecated: false
        explode: true
      responses:
        '200':
          description: Success.
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Market'
          headers:
            CACHE-CONTROL:
              required: true
              deprecated: false
              schema:
                type: string
        '500':
          description: Internal server error.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_markets
  /api/v1/market:
    get:
      tags:
      - Markets
      summary: Get market
      description: Retrieves a market supported by the exchange.
      parameters:
      - name: symbol
        schema:
          type: string
        in: query
        required: true
        deprecated: false
        explode: true
      responses:
        '200':
          description: Success.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Market'
        '400':
          description: Bad request.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_market
  /api/v1/depth:
    get:
      tags:
      - Markets
      summary: Get depth
      description: Retrieves the order book depth for a given market symbol.
      parameters:
      - name: symbol
        schema:
          type: string
        in: query
        required: true
        deprecated: false
        explode: true
      - name: limit
        schema:
          $ref: '#/components/schemas/DepthLimit'
        in: query
        description: Limit on the number of price levels to return on each side. Defaults to `1000`.
        required: false
        deprecated: false
        explode: true
      responses:
        '200':
          description: Success.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Depth'
        '400':
          description: Bad request.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_depth
  /api/v1/prediction:
    get:
      tags:
      - Markets
      summary: Get prediction events
      description: Retrieves all the events and associated markets that are supported by the exchange.
      parameters:
      - name: symbol
        schema:
          type: string
        in: query
        description: The market symbol for the prediction market.
        required: false
        deprecated: false
        explode: true
      - name: tagSlug
        schema:
          type: string
        in: query
        description: The tag slug of the prediction event.
        required: false
        deprecated: false
        explode: true
      - name: eventSlug
        schema:
          type: string
        in: query
        description: The event slug that the prediction market is based on.
        required: false
        deprecated: false
        explode: true
      - name: seriesSlug
        schema:
          type: string
        in: query
        description: The series slug that the prediction event belongs to.
        required: false
        deprecated: false
        explode: true
      - name: resolved
        schema:
          type: boolean
        in: query
        description: Whether the prediction market is resolved.
        required: false
        deprecated: false
        explode: true
      - name: limit
        schema:
          type: integer
          format: uint64
        in: query
        description: Maximum number to return. Default `100`, maximum `1000`.
        required: false
        deprecated: false
        explode: true
      - name: offset
        schema:
          type: integer
          format: uint64
        in: query
        description: Offset. Default `0`.
        required: false
        deprecated: false
        explode: true
      responses:
        '200':
          description: Success.
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
          headers:
            ACCESS-CONTROL-EXPOSE-HEADERS:
              required: true
              deprecated: false
              schema:
                type: string
            X-PAGE-COUNT:
              required: true
              deprecated: false
              schema:
                type: integer
                format: uint64
            X-CURRENT-PAGE:
              required: true
              deprecated: false
              schema:
                type: integer
                format: uint64
            X-PAGE-SIZE:
              required: true
              deprecated: false
              schema:
                type: integer
                format: uint64
            X-TOTAL:
              required: true
              deprecated: false
              schema:
                type: integer
                format: uint64
        '400':
          description: Bad request.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_prediction_events
  /api/v1/prediction/tags:
    get:
      tags:
      - Markets
      summary: Get prediction tags
      description: Retrieves all prediction tags supported by the exchange.
      responses:
        '200':
          description: Success.
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '500':
          description: Internal server error.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_prediction_tags
  /api/v1/market-sessions:
    get:
      tags:
      - Markets
      summary: Get market sessions
      description: 'Retrieves the list of market sessions. To see which sessions a

        specific security trades in, and its quantity constraints per session, see `/api/v1/securities`.'
      responses:
        '200':
          description: Success.
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketSession'
        '500':
          description: Internal server error.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_market_sessions
  /api/v1/securities:
    get:
      tags:
      - Markets
      summary: Get securities
      description: Retrieves tradable securities.
      responses:
        '200':
          description: Success.
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Security'
        '500':
          description: Internal server error.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_securities
  /api/v1/markPrices:
    get:
      tags:
      - Markets
      summary: Get mark prices
      description: 'Retrieves mark prices, index prices, and funding rates for futures

        products, or a specified symbol.'
      parameters:
      - name: symbol
        schema:
          type: string
        in: query
        required: false
        deprecated: false
        explode: true
      - name: marketType
        schema:
          $ref: '#/components/schemas/MarketType'
        in: query
        description: Market type. Defaults to return perp.
        required: false
        deprecated: false
        explode: true
      responses:
        '200':
          description: Success.
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarkPrice'
          headers:
            CACHE-CONTROL:
              required: true
              deprecated: false
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_mark_prices
  /api/v1/openInterest:
    get:
      tags:
      - Markets
      summary: Get open interest
      description: 'Retrieves the current open interest for the given market.

        If no market is provided, then all markets are returned.'
      parameters:
      - name: symbol
        schema:
          type: string
        in: query
        required: false
        deprecated: false
        explode: true
      responses:
        '200':
          description: Success.
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenInterest'
        '400':
          description: Bad request.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_open_interest
  /api/v1/fundingRates:
    get:
      tags:
      - Markets
      summary: Get funding interval rates
      description: Funding interval rate history for futures.
      parameters:
      - name: symbol
        schema:
          type: string
        in: query
        description: Market symbol to query
        required: true
        deprecated: false
        explode: true
      - name: limit
        schema:
          type: integer
          format: uint64
        in: query
        description: Maximum number to return. Default `100`, maximum `10000`.
        required: false
        deprecated: false
        explode: true
      - name: offset
        schema:
          type: integer
          format: uint64
        in: query
        description: Offset for pagination. Default `0`.
        required: false
        deprecated: false
        explode: true
      responses:
        '200':
          description: Success.
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FundingIntervalRate'
          headers:
            ACCESS-CONTROL-EXPOSE-HEADERS:
              required: true
              deprecated: false
              schema:
                type: string
            X-PAGE-COUNT:
              required: true
              deprecated: false
              schema:
                type: integer
                format: uint64
            X-CURRENT-PAGE:
              required: true
              deprecated: false
              schema:
                type: integer
                format: uint64
            X-PAGE-SIZE:
              required: true
              deprecated: false
              schema:
                type: integer
                format: uint64
            X-TOTAL:
              required: true
              deprecated: false
              schema:
                type: integer
                format: uint64
        '400':
          description: Bad request.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_funding_interval_rates
  /api/v1/klines:
    get:
      summary: Get K-lines
      description: 'Returns candles for the given market and interval. Recent data is

        served from the in-memory store; requests reaching further back

        than the store''s retention window fall through to ClickHouse.'
      parameters:
      - name: symbol
        schema:
          type: string
        in: query
        description: Market symbol, e.g. `SOL_USDC`.
        required: true
        deprecated: false
        explode: true
      - name: interval
        schema:
          $ref: '#/components/schemas/KlineInterval'
        in: query
        required: true
        deprecated: false
        explode: true
      - name: startTime
        schema:
          type: integer
          format: int64
        in: query
        description: UTC timestamp in seconds.
        required: true
        deprecated: false
        explode: true
      - name: endTime
        schema:
          type: integer
          format: int64
        in: query
        description: UTC timestamp in seconds. Defaults to now.
        required: false
        deprecated: false
        explode: true
      - name: priceType
        schema:
          $ref: '#/components/schemas/KlinePriceType'
        in: query
        description: K-line price type. Defaults to `last`.
        required: false
        deprecated: false
        explode: true
      responses:
        '200':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Kline'
          headers:
            CACHE-CONTROL:
              required: true
              deprecated: false
              schema:
                type: string
        '400':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_klines
      tags:
      - Markets
  /api/v1/ticker:
    get:
      summary: Get ticker for a single market
      parameters:
      - name: symbol
        schema:
          type: string
        in: query
        required: true
        deprecated: false
        explode: true
      - name: interval
        schema:
          $ref: '#/components/schemas/TickerInterval'
        in: query
        required: false
        deprecated: false
        explode: true
      responses:
        '200':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Ticker'
          headers:
            CACHE-CONTROL:
              required: true
              deprecated: false
              schema:
                type: string
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_ticker
      tags:
      - Markets
  /api/v1/tickers:
    get:
      summary: Get tickers for every market
      parameters:
      - name: interval
        schema:
          $ref: '#/components/schemas/TickerInterval'
        in: query
        required: false
        deprecated: false
        explode: true
      responses:
        '200':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticker'
          headers:
            CACHE-CONTROL:
              required: true
              deprecated: false
              schema:
                type: string
        '500':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: get_tickers
      tags:
      - Markets
components:
  schemas:
    Tag:
      type: object
      title: Tag
      required:
      - slug
      - title
      properties:
        slug:
          type: string
          description: Tag associated with the prediction event.
        title:
          type: string
          description: The tag title of the prediction market.
    ApiErrorResponse:
      type: object
      title: ApiErrorResponse
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
    PredictionMarket:
      type: object
      title: PredictionMarket
      required:
      - marketSymbol
      - question
      - yesOutcomeLabel
      - noOutcomeLabel
      - rules
      - activePrice
      - quoteVolume
      - quoteVolumeLifetime
      - resolutionDelaySecs
      properties:
        marketSymbol:
          type: string
        question:
          type: string
          description: The question that the prediction market will resolve e.g. `'Will England win the 2026 FIFA World Cup?'`
        groupLabel:
          type: string
          description: The short textual label summarising the different market outcomes composing an event.
        yesOutcomeLabel:
          type: string
          description: The yes outcome of the prediction market e.g. "England" for the football match England vs Brazil.
        noOutcomeLabel:
          type: string
          description: The no outcome of the prediction market e.g. "Brazil" for the football match England vs Brazil.
        rules:
          type: string
          description: The rules of the prediction market e.g. "The team that wins the 2025 men's world cup."
        resolvedAt:
          type: string
          format: naive-date-time
          description: Time at which the prediction market was resolved.
        resolutionPrice:
          type: string
          format: decimal
          description: The price at which the prediction market was resolved.
        activePrice:
          type: string
          format: decimal
          description: The active traded price of the prediction market.
        quoteVolume:
          type: string
          format: decimal
          description: The 24hr quote volume of the prediction market.
        quoteVolumeLifetime:
          type: string
          format: decimal
          description: The lifetime quote volume of the prediction market.
        imgUrl:
          type: string
          description: An image URL associated with the market.
        resolutionCondition:
          description: The condition that determines how the prediction market resolves.
          allOf:
          - $ref: '#/components/schemas/ResolutionCondition'
          - description: The condition that determines how the prediction market resolves.
        proposedResolution:
          type: boolean
          description: The proposed resolution for the market (true = yes, false = no).
        proposedResolutionAt:
          type: string
          format: naive-date-time
          description: Time at which the proposed resolution was set.
        resolutionDelaySecs:
          type: integer
          format: int32
          description: 'Seconds to wait after `proposed_resolution_at` before this market is resolved.

            Bounded server-side to [0, 604800] (7 days).'
    OpenInterest:
      type: object
      title: OpenInterest
      required:
      - symbol
      - timestamp
      properties:
        symbol:
          type: string
          description: The symbol of the market.
        openInterest:
          type: string
          format: decimal
          description: The open interest.
        timestamp:
          type: integer
          format: int64
          description: Timestamp.
    TickerInterval:
      type: string
      enum:
      - 1d
      - 1w
    MarkPrice:
      type: object
      title: MarkPrice
      required:
      - markPrice
      - symbol
      properties:
        fundingRate:
          type: string
          format: decimal
          description: 'The funding rate for the current interval.

            Only returned for perpetual markets.'
        indexPrice:
          type: string
          format: decimal
          description: 'The index price for the market.

            Only returned for perpetual markets.'
        markPrice:
          type: string
          format: decimal
          description: The mark price for the market.
        nextFundingTimestamp:
          type: integer
          format: int64
          description: 'The end time of the current interval and start time of next interval.

            Funding payments will be distributed at this time.

            Only returned for perpetual markets.'
        symbol:
          type: string
          description: The symbol of the market.
    DepthLimit:
      type: string
      enum:
      - '5'
      - '10'
      - '20'
      - '50'
      - '100'
      - '500'
      - '1000'
    Market:
      type: object
      title: Market
      required:
      - symbol
      - baseSymbol
      - quoteSymbol
      - marketType
      - filters
      - orderBookState
      - createdAt
      - visible
      properties:
        symbol:
          type: string
          description: Symbol of the market, e.g. `ETH_USDC`
        baseSymbol:
          type: string
          description: The base asset of the market.
        quoteSymbol:
          type: string
          description: The quote asset of the market.
        marketType:
          description: The type of the market.
          allOf:
          - $ref: '#/components/schemas/MarketType'
          - description: The type of the market.
        filters:
          description: Price, lot and leverage rules.
          allOf:
          - $ref: '#/components/schemas/OrderBookFilters'
          - description: Price, lot and leverage rules.
        imfFunction:
          description: IMF function.
          allOf:
          - $ref: '#/components/schemas/PositionImfFunction'
          - description: IMF function.
        mmfFunction:
          description: MMF function.
          allOf:
          - $ref: '#/components/schemas/PositionImfFunction'
          - description: MMF function.
        fundingInterval:
          type: integer
          format: uint64
          description: Funding interval for perpetuals in milliseconds.
        fundingRateUpperBound:
          type: string
          format: decimal
          description: 'Funding rate upper bound for perpetual markets. In basis points. E.g. 10

            = 10bps'
        fundingRateLowerBound:
          type: string
          format: decimal
          description: 'Funding rate lower bound for perpetual markets. In basis points. E.g.

            -10 = -10bps'
        openInterestLimit:
          type: string
          format: decimal
          description: Maximum open interest limit for the market if the market is a future.
        orderBookState:
          description: The order book state.
          allOf:
          - $ref: '#/components/schemas/OrderBookState'
          - description: The order book state.
        createdAt:
          type: string
          format: naive-date-time
          description: Market created at time.
        visible:
          type: boolean
          description: Market currently visible.
        positionLimitWeight:
          type: string
          format: decimal
          description: 'Position limit weight coefficient.

            Used to calculate position limits when clearing a trade.'
    CustodyAsset:
