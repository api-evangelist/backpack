      - rfqId
      - bidPrice
      - askPrice
      properties:
        rfqId:
          type: string
          description: RFQ ID.
        clientId:
          type: integer
          format: uint32
          description: Custom RFQ quote ID.
        bidPrice:
          type: string
          format: decimal
          description: Bid price.
        askPrice:
          type: string
          format: decimal
          description: Ask price.
        autoLend:
          type: boolean
          description: Whether to lend proceeds.
        autoLendRedeem:
          type: boolean
          description: Whether to redeem lends if required to fulfill the Quote.
        autoBorrow:
          type: boolean
          description: Whether to borrow assets if required to fulfill the Quote.
        autoBorrowRepay:
          type: boolean
          description: Whether to use proceeds to repay borrows.
    RequestForQuoteCancelPayload:
      type: object
      title: RequestForQuoteCancelPayload
      properties:
        rfqId:
          type: string
          description: RFQ ID.
        clientId:
          type: integer
          format: uint32
          description: Custom RFQ ID.
    RequestForQuoteRefreshPayload:
      type: object
      title: RequestForQuoteRefreshPayload
      required:
      - rfqId
      properties:
        rfqId:
          type: string
          description: RFQ ID. An RFQ can only be refreshed using the RFQ ID.
    QuoteHistorical:
      type: object
      title: QuoteHistorical
      required:
      - rfqId
      - quoteId
      - bidPrice
      - askPrice
      - status
      - createdAt
      - deferredSettlement
      properties:
        rfqId:
          type: string
          description: Unique RFQ order ID, assigned by the matching engine.
        quoteId:
          type: string
          description: Unique RFQ quote ID, assigned by the matching engine.
        clientId:
          type: integer
          format: uint32
          description: Custom RFQ quote ID, assigned by the maker (optionally).
        bidPrice:
          type: string
          format: decimal
          description: Quote bid price.
        askPrice:
          type: string
          format: decimal
          description: Quote ask price.
        status:
          description: Status.
          allOf:
          - $ref: '#/components/schemas/OrderStatus'
          - description: Status.
        createdAt:
          type: string
          format: naive-date-time
          description: Time the quote was created.
        deferredSettlement:
          type: boolean
          description: Whether this quote uses deferred settlement.
    SortDirection:
      type: string
      enum:
      - Asc
      - Desc
    RfqWithQuotes:
      type: object
      title: RfqWithQuotes
      description: An open RFQ together with the quotes submitted for it.
      required:
      - rfq
      - quotes
      properties:
        rfq:
          description: The RFQ.
          allOf:
          - $ref: '#/components/schemas/RequestForQuote'
          - description: The RFQ.
        quotes:
          type: array
          description: Quotes submitted for this RFQ.
          items:
            $ref: '#/components/schemas/Quote'
    QuoteAcceptPayload:
      type: object
      title: QuoteAcceptPayload
      required:
      - quoteId
      properties:
        rfqId:
          type: string
          description: RFQ ID.
        clientId:
          type: integer
          format: uint32
          description: Custom RFQ ID.
        quoteId:
          type: string
          description: RFQ quote ID.
    RequestForQuoteHistorical:
      type: object
      title: RequestForQuoteHistorical
      required:
      - rfqId
      - symbol
      - side
      - submissionTime
      - expiryTime
      - status
      - executionMode
      - createdAt
      properties:
        rfqId:
          type: string
          description: Unique RFQ order ID, assigned by the matching engine.
        clientId:
          type: integer
          format: uint32
          description: Custom RFQ order ID, assigned by the user (optionally).
        symbol:
          type: string
          description: Market symbol.
        side:
          description: Side.
          allOf:
          - $ref: '#/components/schemas/Side'
          - description: Side.
        price:
          type: string
          format: decimal
          description: 'RFQ price.

            Price of the RFQ. Only when execution mode is `Immediate`.'
        quantity:
          type: string
          format: decimal
          description: Quantity to fill (in base asset).
        quoteQuantity:
          type: string
          format: decimal
          description: Quantity to fill (in quote asset).
        submissionTime:
          type: string
          format: naive-date-time
          description: 'Time by which quotes must be submitted for

            the RFQ.'
        expiryTime:
          type: string
          format: naive-date-time
          description: Time by which the RFQ expires if no match.
        status:
          description: Status.
          allOf:
          - $ref: '#/components/schemas/OrderStatus'
          - description: Status.
        executionMode:
          description: RFQ execution mode.
          allOf:
          - $ref: '#/components/schemas/RfqExecutionMode'
          - description: RFQ execution mode.
        createdAt:
          type: string
          format: naive-date-time
          description: Time the RFQ was created.
        deferredSettlementQuoteId:
          type: string
          description: Quote ID of the accepted deferred settlement quote, if any.
    RfqExecutionMode:
